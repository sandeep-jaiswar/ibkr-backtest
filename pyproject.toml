[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ibkr-backtest"
version = "0.1.0"
description = "Backtest equity strategies on Interactive Brokers historical data, tracked with MLflow and persisted in DuckDB."
requires-python = ">=3.11"
dependencies = [
    "ib_async>=2.0",
    "duckdb==1.3.2",
    "mlflow>=3.0",
    "pandas>=2.2,<3",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
ibbt = "ibbt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
